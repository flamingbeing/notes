# The Notes Claude Desktop extension (mcp/, README "Install"). On a PR: run the MCP tests and build the .mcpb (kept as a
# run artifact, to try before merging). On main: the same, then put it on the release "notes-mcp" as notes.mcpb,
# replacing the old one, so the download link never changes:
#   https://github.com/flamingbeing/notes/releases/download/notes-mcp/notes.mcpb
# The bundle also carries the app code the server imports (app/src/notes, app/src/config.js), hence those paths too.
name: Notes MCP extension

on:
  pull_request:
    paths: ['mcp/**', 'app/src/notes/**', 'app/src/config.js', '.github/workflows/notes-mcpb.yml']
  push:
    branches: [main]
    paths: ['mcp/**', 'app/src/notes/**', 'app/src/config.js', '.github/workflows/notes-mcpb.yml']
  workflow_dispatch:

concurrency:
  group: notes-mcpb-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a cancelled main run could leave the release without its file

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flamingbeing/app-devkit/setup-node@v1.16.0
      - name: MCP tests
        working-directory: mcp
        run: npm ci --no-audit --no-fund && npm test
      - name: Build the extension
        run: |
          node mcp/tools/build-mcpb.mjs "$RUNNER_TEMP/stage"
          npx -y @anthropic-ai/mcpb@2.1.2 validate "$RUNNER_TEMP/stage/manifest.json"
          npx -y @anthropic-ai/mcpb@2.1.2 pack "$RUNNER_TEMP/stage" "$RUNNER_TEMP/notes.mcpb"
      - name: Keep it with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-mcpb
          path: ${{ runner.temp }}/notes.mcpb
          retention-days: 14

  publish:
    needs: build   # the tests passed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the release upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flamingbeing/app-devkit/setup-node@v1.16.0
      - name: Build the extension
        run: |
          (cd mcp && npm ci --no-audit --no-fund)   # build-mcpb imports the server, which needs its packages
          node mcp/tools/build-mcpb.mjs "$RUNNER_TEMP/stage"
          npx -y @anthropic-ai/mcpb@2.1.2 pack "$RUNNER_TEMP/stage" "$RUNNER_TEMP/notes.mcpb"
      - name: Publish to the notes-mcp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./mcp/package.json').version")
          notes="Notes extension for Claude Desktop, version $v (built from ${GITHUB_SHA::8}). Open the .mcpb file to install it; setup: https://github.com/${GITHUB_REPOSITORY}/tree/main/mcp#readme"
          if gh release view notes-mcp >/dev/null 2>&1; then
            gh release edit notes-mcp --title "Notes for Claude Desktop" --notes "$notes" --latest=false
          else
            gh release create notes-mcp --target "$GITHUB_SHA" --title "Notes for Claude Desktop" --notes "$notes" --latest=false
          fi
          gh release upload notes-mcp "$RUNNER_TEMP/notes.mcpb" --clobber
